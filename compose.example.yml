services:
  discord-minecraft-bot:
    build: .
    container_name: discord-minecraft-bot
    restart: unless-stopped
    env_file: .env
    networks:
      - minecraft-control

  # Add this network to your existing Crafty service too:
  # crafty:
  #   networks:
  #     - minecraft-control

networks:
  minecraft-control:
    name: minecraft-control
